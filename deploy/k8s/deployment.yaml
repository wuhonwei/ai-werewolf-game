apiVersion: apps/v1
kind: Deployment
metadata:
  name: werewolf-server
  namespace: werewolf
spec:
  replicas: 2
  selector:
    matchLabels:
      app: werewolf-server
  template:
    metadata:
      labels:
        app: werewolf-server
    spec:
      containers:
        - name: server
          image: registry.cn-hangzhou.aliyuncs.com/<命名空间>/ai-werewolf-server:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - secretRef:
                name: werewolf-env
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: werewolf-server
  namespace: werewolf
spec:
  selector:
    app: werewolf-server
  ports:
    - port: 80
      targetPort: 3000
